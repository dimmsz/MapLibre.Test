<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MapLibre Layer Lab</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"><link rel="stylesheet" href="./style.css"></head>
<body><header class="topbar"><div><h1>MapLibre Layer Lab</h1><p>レイヤー・ソース・表示条件をリアルタイム調整</p></div><div><button id="save-button">設定を保存</button> <button id="reset-button" class="secondary">初期値</button></div></header><main class="app"><aside class="panel"><section><h2>Map</h2><label>中心経度 <input id="lng" type="number" step="0.000001"></label><label>中心緯度 <input id="lat" type="number" step="0.000001"></label><label>ズーム <input id="zoom" type="number" min="0" max="22" step="0.1"></label><button id="fly-home">名古屋へ移動</button></section><section><div class="section-title"><h2>Layers</h2><button id="add-layer" class="small">＋レイヤー</button></div><div id="layers"></div></section><section><h2>Style JSON</h2><textarea id="style-json" spellcheck="false"></textarea><button id="apply-style">Style JSONを適用</button></section><section><h2>状態</h2><pre id="status">初期化中…</pre></section></aside><section id="map"></section></main><script type="module" src="./app.js"></script></body></html>
